<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한자의 아침 — 지난주와 이번 주</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;
  background:#f4f1eb;
  color:#24211d;
  display:flex;
  align-items:center;
  justify-content:center;
}

.app{
  width:min(1100px,94vw);
  min-height:92vh;
  display:flex;
  flex-direction:column;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:24px 4px;
}

.brand{font-size:14px;letter-spacing:.12em}
.counter{font-size:12px;color:#777}

main{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.hidden{display:none!important}

footer{
  padding:25px 4px;
  text-align:center;
  color:#999;
  font-size:11px;
}

/* 카드 더미 */

.week-head{
  margin:0 0 14px;
  font-size:13px;
  letter-spacing:.12em;
  color:#8a8177;
}

.week-title{
  font-family:serif;
  font-weight:400;
  font-size:clamp(28px,5vw,52px);
  margin:0 0 10px;
}

.week-sub{
  font-size:13px;
  color:#8a8177;
  margin:0 0 34px;
}

.deck-stage{
  position:relative;
  width:min(430px,82vw);
  aspect-ratio:3/4;
  margin:0 auto 28px;
  perspective:1400px;
}

.deck-card{
  position:absolute;
  inset:0;
  background:#fbfaf7;
  border:1px solid #d7d0c6;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:
    transform .65s cubic-bezier(.2,.75,.2,1),
    opacity .35s,
    filter .35s;
  box-shadow:0 18px 42px #00000010;
  transform-origin:50% 75%;
}

.deck-card .letter{
  font-family:serif;
  font-size:clamp(100px,18vw,170px);
  line-height:1;
}

.deck-card .reading{
  margin-top:25px;
  font-size:17px;
}

.deck-card .tag{
  margin-top:10px;
  color:#81786e;
  font-size:14px;
}

.deck-card .date{
  position:absolute;
  left:22px;
  top:20px;
  font-size:11px;
  letter-spacing:.1em;
  color:#a59b90;
}

.deck-card .now{
  position:absolute;
  right:22px;
  top:20px;
  font-size:10px;
  letter-spacing:.11em;
  color:#6f655b;
}

.deck-card.active{
  z-index:20;
  transform:translateY(-10px) rotate(0deg) scale(1.015);
}

.deck-card.back-1{
  z-index:9;
  transform:translate(12px,14px) rotate(1.8deg) scale(.985);
}

.deck-card.back-2{
  z-index:8;
  transform:translate(-13px,24px) rotate(-2.4deg) scale(.97);
}

.deck-card.back-3{
  z-index:7;
  transform:translate(20px,34px) rotate(3deg) scale(.955);
}

.deck-card.back-4{
  z-index:6;
  transform:translate(-18px,43px) rotate(-3.4deg) scale(.94);
}

.deck-card.back-5{
  z-index:5;
  transform:translate(10px,50px) rotate(1.4deg) scale(.925);
}

.deck-card.hidden-card{
  opacity:0;
  pointer-events:none;
}

.deck.shuffling .deck-card{
  animation:shuffle .78s ease both;
}

.deck.shuffling .deck-card:nth-child(2n){
  animation-delay:.04s;
}

.deck.shuffling .deck-card:nth-child(3n){
  animation-delay:.08s;
}

@keyframes shuffle{
  0%{
    transform:translate(0,0) rotate(0) scale(1);
  }
  30%{
    transform:translate(-38px,-5px) rotate(-6deg) scale(.98);
  }
  58%{
    transform:translate(42px,-8px) rotate(6deg) scale(.985);
  }
  80%{
    transform:translate(-10px,3px) rotate(-1.5deg) scale(.99);
  }
}

.deck-hint{
  font-size:12px;
  color:#9a928a;
  margin-top:14px;
}

.deck-actions,
.actions{
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
  margin-top:20px;
}

.archive-note{
  font-size:11px;
  color:#aaa;
  margin-top:12px;
}

/* 지난주와 이번 주 */

.week-columns{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:64px;
  width:100%;
  align-items:start;
}

.week-panel{
  min-width:0;
  text-align:center;
  padding:18px 0 0;
}

.week-panel .week-title{
  font-size:clamp(26px,3.2vw,40px);
}

.week-panel .week-sub{
  line-height:1.7;
  min-height:44px;
  margin-bottom:24px;
}

.week-panel .deck-stage{
  width:min(360px,85%);
  margin-bottom:50px;
}

.week-panel .deck-card .letter{
  font-size:clamp(100px,12vw,150px);
}

.week-panel .deck-card .tag{
  padding:0 18px;
  line-height:1.6;
}

.week-panel .deck-card:focus-visible{
  outline:3px solid #81786e;
  outline-offset:5px;
}

.week-empty{
  padding:80px 20px;
  color:#8a8177;
  line-height:1.8;
}

.selection-label{
  font-size:13px;
  color:#8a8177;
  margin:12px 0 24px;
}

@media(max-width:700px){
  .week-columns{
    grid-template-columns:1fr;
    gap:46px;
  }

  .week-panel + .week-panel{
    border-top:1px solid #d7d0c6;
    padding-top:38px;
  }

  .week-panel .deck-stage{
    width:min(360px,78vw);
  }

  .week-panel .deck-card .letter{
    font-size:clamp(100px,28vw,150px);
  }

  .week-panel .week-sub{
    min-height:0;
  }
}

/* 앞뒤 카드 */

.card-wrap{
  perspective:1400px;
  width:min(430px,82vw);
  aspect-ratio:3/4;
  margin:5px auto 28px;
  cursor:pointer;
}

.card{
  width:100%;
  height:100%;
  position:relative;
  transform-style:preserve-3d;
  transition:transform .7s cubic-bezier(.2,.7,.2,1);
}

.card.flipped{
  transform:rotateY(180deg);
}

.face{
  position:absolute;
  inset:0;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  background:#fbfaf7;
  border:1px solid #d7d0c6;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:35px;
}

.back{
  transform:rotateY(180deg);
}

.face .big{
  font-family:serif;
  font-size:clamp(100px,18vw,170px);
  line-height:1;
}

.face .title{
  font-size:17px;
  margin-top:25px;
}

.face .phrase{
  margin-top:10px;
  color:#81786e;
  font-size:14px;
}

.back .mini{
  font-size:12px;
  letter-spacing:.12em;
  color:#968b80;
  margin-bottom:35px;
}

.back h2{
  font-family:serif;
  font-weight:400;
  font-size:clamp(22px,4vw,32px);
  line-height:1.5;
  margin:0 0 25px;
}

.back p{
  font-size:14px;
  line-height:2;
  color:#5f5952;
  max-width:310px;
  margin:0;
}

.hint{
  font-size:12px;
  color:#9a928a;
}

/* 버튼 */

button{
  border:1px solid #cfc7bd;
  background:transparent;
  padding:11px 20px;
  border-radius:30px;
  cursor:pointer;
  font:inherit;
  font-size:12px;
  color:#4c4741;
}

button:hover{
  background:#ebe6df;
}

/* 해설 및 설문 팝업 */

.modal{
  position:fixed;
  inset:0;
  background:#0008;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:100;
}

.modalbox{
  background:#faf8f4;
  width:min(650px,94vw);
  max-height:86vh;
  overflow:auto;
  padding:38px;
}

.modalbox .mletter{
  font-family:serif;
  font-size:72px;
  text-align:center;
  margin-bottom:12px;
}

.modalbox h2{
  font-family:serif;
  font-weight:400;
  text-align:center;
  margin:0 0 30px;
}

.section{
  margin:25px 0;
}

.section h3{
  font-size:12px;
  letter-spacing:.12em;
  color:#8b8176;
  margin-bottom:10px;
}

.section p{
  font-family:serif;
  font-size:16px;
  line-height:2;
  margin:0;
  white-space:pre-line;
}

.form-modalbox{
  width:min(740px,96vw);
  height:min(850px,90dvh);
  max-height:90dvh;
  padding:14px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.form-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:2px 6px 10px;
  font-size:14px;
}

#storyFrame{
  width:100%;
  border:0;
  flex:1;
  min-height:0;
  background:#fff;
}

.form-note{
  margin:8px 0 0;
  text-align:center;
  font-size:12px;
  color:#777;
}

.form-note a{
  color:#4c4741;
  text-decoration:underline;
}

@media(max-width:650px){
  .modalbox{padding:25px}

  .form-modalbox{
    width:100%;
    height:94dvh;
    max-height:94dvh;
    padding:10px;
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="brand">한자의 아침</div>
  <div class="counter" id="counter"></div>
</header>

<!-- 메인 화면 -->

<main id="home">
  <div class="week-columns">

    <section class="week-panel" aria-labelledby="previousTitle">
      <div class="week-head">LAST WEEK</div>
      <h1 class="week-title" id="previousTitle">지난주의 한자</h1>

      <p class="week-sub">
        지난주에 놓친 질문이 있나요?<br>
        지금 이야기를 남겨도 좋습니다.
      </p>

      <div class="deck-stage">
        <div class="deck" id="previousDeck"></div>
      </div>

      <button id="previousOpen" onclick="choose(previousKey())">
        지난주 한자 쓰기
      </button>
    </section>

    <section class="week-panel" aria-labelledby="currentTitle">
      <div class="week-head">THIS WEEK</div>
      <h2 class="week-title" id="currentTitle">이번 주의 한자</h2>

      <p class="week-sub">
        이번 주 한 글자와 함께<br>
        내 마음을 들여다보세요.
      </p>

      <div class="deck-stage">
        <div class="deck" id="deck"></div>
      </div>

      <button onclick="choose(activeKeyFromDate())">
        이번 주 한자 쓰기
      </button>
    </section>

  </div>

  <div class="deck-hint">
    카드를 누르면 질문을 확인할 수 있습니다.
  </div>

  <div class="deck-actions">
    <button onclick="shuffleDeck()">카드 다시 섞기</button>
  </div>

  <div class="archive-note" id="archiveNote"></div>
</main>

<!-- 카드 앞뒤 화면 -->

<main id="cardScreen" class="
