<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한자의 아침 — 지난주와 이번 주</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;
  background:#f4f1eb;
  color:#24211d;
  display:flex;
  align-items:center;
  justify-content:center;
}

.app{
  width:min(1100px,94vw);
  min-height:92vh;
  display:flex;
  flex-direction:column;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:24px 4px;
}

.brand{font-size:14px;letter-spacing:.12em}
.counter{font-size:12px;color:#777}

main{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.hidden{display:none!important}

footer{
  padding:25px 4px;
  text-align:center;
  color:#999;
  font-size:11px;
}

/* 카드 더미 */

.week-head{
  margin:0 0 14px;
  font-size:13px;
  letter-spacing:.12em;
  color:#8a8177;
}

.week-title{
  font-family:serif;
  font-weight:400;
  font-size:clamp(28px,5vw,52px);
  margin:0 0 10px;
}

.week-sub{
  font-size:13px;
  color:#8a8177;
  margin:0 0 34px;
}

.deck-stage{
  position:relative;
  width:min(430px,82vw);
  aspect-ratio:3/4;
  margin:0 auto 28px;
  perspective:1400px;
}

.deck-card{
  position:absolute;
  inset:0;
  background:#fbfaf7;
  border:1px solid #d7d0c6;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:
    transform .65s cubic-bezier(.2,.75,.2,1),
    opacity .35s,
    filter .35s;
  box-shadow:0 18px 42px #00000010;
  transform-origin:50% 75%;
}

.deck-card .letter{
  font-family:serif;
  font-size:clamp(100px,18vw,170px);
  line-height:1;
}

.deck-card .reading{
  margin-top:25px;
  font-size:17px;
}

.deck-card .tag{
  margin-top:10px;
  color:#81786e;
  font-size:14px;
}

.deck-card .date{
  position:absolute;
  left:22px;
  top:20px;
  font-size:11px;
  letter-spacing:.1em;
  color:#a59b90;
}

.deck-card .now{
  position:absolute;
  right:22px;
  top:20px;
  font-size:10px;
  letter-spacing:.11em;
  color:#6f655b;
}

.deck-card.active{
  z-index:20;
  transform:translateY(-10px) rotate(0deg) scale(1.015);
}

.deck-card.back-1{
  z-index:9;
  transform:translate(12px,14px) rotate(1.8deg) scale(.985);
}

.deck-card.back-2{
  z-index:8;
  transform:translate(-13px,24px) rotate(-2.4deg) scale(.97);
}

.deck-card.back-3{
  z-index:7;
  transform:translate(20px,34px) rotate(3deg) scale(.955);
}

.deck-card.back-4{
  z-index:6;
  transform:translate(-18px,43px) rotate(-3.4deg) scale(.94);
}

.deck-card.back-5{
  z-index:5;
  transform:translate(10px,50px) rotate(1.4deg) scale(.925);
}

.deck-card.hidden-card{
  opacity:0;
  pointer-events:none;
}

.deck.shuffling .deck-card{
  animation:shuffle .78s ease both;
}

.deck.shuffling .deck-card:nth-child(2n){
  animation-delay:.04s;
}

.deck.shuffling .deck-card:nth-child(3n){
  animation-delay:.08s;
}

@keyframes shuffle{
  0%{
    transform:translate(0,0) rotate(0) scale(1);
  }
  30%{
    transform:translate(-38px,-5px) rotate(-6deg) scale(.98);
  }
  58%{
    transform:translate(42px,-8px) rotate(6deg) scale(.985);
  }
  80%{
    transform:translate(-10px,3px) rotate(-1.5deg) scale(.99);
  }
}

.deck-hint{
  font-size:12px;
  color:#9a928a;
  margin-top:14px;
}

.deck-actions,
.actions{
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
  margin-top:20px;
}

.archive-note{
  font-size:11px;
  color:#aaa;
  margin-top:12px;
}

/* 지난주와 이번 주 */

.week-columns{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:64px;
  width:100%;
  align-items:start;
}

.week-panel{
  min-width:0;
  text-align:center;
  padding:18px 0 0;
}

.week-panel .week-title{
  font-size:clamp(26px,3.2vw,40px);
}

.week-panel .week-sub{
  line-height:1.7;
  min-height:44px;
  margin-bottom:24px;
}

.week-panel .deck-stage{
  width:min(360px,85%);
  margin-bottom:50px;
}

.week-panel .deck-card .letter{
  font-size:clamp(100px,12vw,150px);
}

.week-panel .deck-card .tag{
  padding:0 18px;
  line-height:1.6;
}

.week-panel .deck-card:focus-visible{
  outline:3px solid #81786e;
  outline-offset:5px;
}

.week-empty{
  padding:80px 20px;
  color:#8a8177;
  line-height:1.8;
}

.selection-label{
  font-size:13px;
  color:#8a8177;
  margin:12px 0 24px;
}

@media(max-width:700px){
  .week-columns{
    grid-template-columns:1fr;
    gap:46px;
  }

  .week-panel + .week-panel{
    border-top:1px solid #d7d0c6;
    padding-top:38px;
  }

  .week-panel .deck-stage{
    width:min(360px,78vw);
  }

  .week-panel .deck-card .letter{
    font-size:clamp(100px,28vw,150px);
  }

  .week-panel .week-sub{
    min-height:0;
  }
}

/* 앞뒤 카드 */

.card-wrap{
  perspective:1400px;
  width:min(430px,82vw);
  aspect-ratio:3/4;
  margin:5px auto 28px;
  cursor:pointer;
}

.card{
  width:100%;
  height:100%;
  position:relative;
  transform-style:preserve-3d;
  transition:transform .7s cubic-bezier(.2,.7,.2,1);
}

.card.flipped{
  transform:rotateY(180deg);
}

.face{
  position:absolute;
  inset:0;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  background:#fbfaf7;
  border:1px solid #d7d0c6;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:35px;
}

.back{
  transform:rotateY(180deg);
}

.face .big{
  font-family:serif;
  font-size:clamp(100px,18vw,170px);
  line-height:1;
}

.face .title{
  font-size:17px;
  margin-top:25px;
}

.face .phrase{
  margin-top:10px;
  color:#81786e;
  font-size:14px;
}

.back .mini{
  font-size:12px;
  letter-spacing:.12em;
  color:#968b80;
  margin-bottom:35px;
}

.back h2{
  font-family:serif;
  font-weight:400;
  font-size:clamp(22px,4vw,32px);
  line-height:1.5;
  margin:0 0 25px;
}

.back p{
  font-size:14px;
  line-height:2;
  color:#5f5952;
  max-width:310px;
  margin:0;
}

.hint{
  font-size:12px;
  color:#9a928a;
}

/* 버튼 */

button{
  border:1px solid #cfc7bd;
  background:transparent;
  padding:11px 20px;
  border-radius:30px;
  cursor:pointer;
  font:inherit;
  font-size:12px;
  color:#4c4741;
}

button:hover{
  background:#ebe6df;
}

/* 해설 및 설문 팝업 */

.modal{
  position:fixed;
  inset:0;
  background:#0008;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:100;
}

.modalbox{
  background:#faf8f4;
  width:min(650px,94vw);
  max-height:86vh;
  overflow:auto;
  padding:38px;
}

.modalbox .mletter{
  font-family:serif;
  font-size:72px;
  text-align:center;
  margin-bottom:12px;
}

.modalbox h2{
  font-family:serif;
  font-weight:400;
  text-align:center;
  margin:0 0 30px;
}

.section{
  margin:25px 0;
}

.section h3{
  font-size:12px;
  letter-spacing:.12em;
  color:#8b8176;
  margin-bottom:10px;
}

.section p{
  font-family:serif;
  font-size:16px;
  line-height:2;
  margin:0;
  white-space:pre-line;
}

.form-modalbox{
  width:min(740px,96vw);
  height:min(850px,90dvh);
  max-height:90dvh;
  padding:14px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.form-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:2px 6px 10px;
  font-size:14px;
}

#storyFrame{
  width:100%;
  border:0;
  flex:1;
  min-height:0;
  background:#fff;
}

.form-note{
  margin:8px 0 0;
  text-align:center;
  font-size:12px;
  color:#777;
}

.form-note a{
  color:#4c4741;
  text-decoration:underline;
}

@media(max-width:650px){
  .modalbox{padding:25px}

  .form-modalbox{
    width:100%;
    height:94dvh;
    max-height:94dvh;
    padding:10px;
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="brand">한자의 아침</div>
  <div class="counter" id="counter"></div>
</header>

<!-- 메인 화면 -->

<main id="home">
  <div class="week-columns">

    <section class="week-panel" aria-labelledby="previousTitle">
      <div class="week-head">LAST WEEK</div>
      <h1 class="week-title" id="previousTitle">지난주의 한자</h1>

      <p class="week-sub">
        지난주에 놓친 질문이 있나요?<br>
        지금 이야기를 남겨도 좋습니다.
      </p>

      <div class="deck-stage">
        <div class="deck" id="previousDeck"></div>
      </div>

      <button id="previousOpen" onclick="choose(previousKey())">
        지난주 한자 쓰기
      </button>
    </section>

    <section class="week-panel" aria-labelledby="currentTitle">
      <div class="week-head">THIS WEEK</div>
      <h2 class="week-title" id="currentTitle">이번 주의 한자</h2>

      <p class="week-sub">
        이번 주 한 글자와 함께<br>
        내 마음을 들여다보세요.
      </p>

      <div class="deck-stage">
        <div class="deck" id="deck"></div>
      </div>

      <button onclick="choose(activeKeyFromDate())">
        이번 주 한자 쓰기
      </button>
    </section>

  </div>

  <div class="deck-hint">
    카드를 누르면 질문을 확인할 수 있습니다.
  </div>

  <div class="deck-actions">
    <button onclick="shuffleDeck()">카드 다시 섞기</button>
  </div>

  <div class="archive-note" id="archiveNote"></div>
</main>

<!-- 카드 앞뒤 화면 -->

<main id="cardScreen" class="hidden">
  <div class="selection-label" id="selectionLabel"></div>

  <div class="card-wrap" onclick="flipCard()">
    <div class="card" id="card">

      <div class="face front">
        <div class="big" id="bigChar"></div>
        <div class="title" id="reading"></div>
        <div class="phrase" id="phrase"></div>
      </div>

      <div class="face back">
        <div class="mini">한 번 더 생각해보기</div>
        <h2 id="question"></h2>
        <p id="prompt"></p>
      </div>

    </div>
  </div>

  <div class="hint">
    카드를 클릭하면 뒤집힙니다
  </div>

  <div class="actions">
    <button onclick="openExplain()">카드 해설</button>
    <button onclick="story()">내 이야기 남기기</button>
    <button onclick="home()">지난주 · 이번 주로</button>
  </div>
</main>

<footer>
  SPACE 카드 뒤집기 · N 지난주 · 이번 주로 · ESC 닫기
</footer>

</div>

<!-- 카드 해설 팝업 -->

<div
  id="modal"
  class="modal hidden"
  onclick="if(event.target===this)closeModal()"
>
  <div class="modalbox">
    <div class="mletter" id="mletter"></div>
    <h2 id="mtitle"></h2>

    <div class="section">
      <h3>글자의 이야기</h3>
      <p id="storyText"></p>
    </div>

    <div class="section">
      <h3>한 번 더 생각해보기</h3>
      <p id="mquestion"></p>
    </div>

    <div class="actions">
      <button onclick="closeModal()">닫기</button>
    </div>
  </div>
</div>

<!-- 이야기 작성 Google 설문 팝업 -->

<div
  id="storyModal"
  class="modal hidden"
  role="dialog"
  aria-modal="true"
  aria-label="내 이야기 남기기"
  onclick="if(event.target===this)closeModal()"
>
  <div class="modalbox form-modalbox">

    <div class="form-header">
      <strong id="storyHeading">내 이야기 남기기</strong>
      <button type="button" onclick="closeModal()">✕ 닫기</button>
    </div>

    <iframe
      id="storyFrame"
      title="한자의 아침 이야기 편지 구글 설문"
      loading="lazy"
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>

    <p class="form-note">
      설문이 보이지 않으면
      <a
        href="https://docs.google.com/forms/d/1rQY5PHKkGA31ON1RQDnor91ufuciVmziSLKlvdksg6U/viewform"
        target="_blank"
        rel="noopener noreferrer"
      >구글 설문 직접 열기</a>
    </p>

  </div>
</div>

<script>
/*
  자동 전환 기준: 한국 시간(Asia/Seoul) 시작일 오전 0시

  새 카드 추가:
  cards 배열 끝에 새 객체를 추가하고
  start에 해당 화요일 날짜를 입력합니다.
*/

const cards = [
  {
    key:'joy',
    start:'2026-09-28',
    char:'樂',
    reading:'즐거울 락',
    phrase:'함께할 때 커지는 즐거움',
    question:'요즘 나는 무엇과 함께할 때<br>가장 즐거운가요?',
    prompt:'사람일 수도, 장소일 수도, 아주 사소한 순간일 수도 있습니다.<br>하나의 장면을 떠올려보세요.',
    story:`樂은 본래 나무로 만든 악기의 모습을 담은 글자입니다.

아래의 木은 악기의 바탕이 되는 나무를, 가운데 이어진 모습은 현을 떠올리게 합니다. 소리는 한 사람에게서 시작하지만 다른 사람의 귀에 닿고, 여러 소리가 만나면 하나의 음악이 됩니다.

그래서 樂의 즐거움은 혼자 움켜쥔 기쁨보다 누군가와 나누며 커지는 즐거움으로도 읽을 수 있습니다.

당신은 요즘 무엇과 함께할 때 가장 즐거운가요?`
  },
  {
    key:'sadness',
    start:'2026-10-05',
    char:'悲',
    reading:'슬플 비',
    phrase:'소중했던 것을 알아보는 마음',
    question:'최근 나를 슬프게 한 일은<br>무엇인가요?',
    prompt:'사라진 것, 멀어진 것, 마음에 오래 남은 장면을 떠올려보세요.',
    story:`悲는 非와 心이 합쳐진 글자입니다.

슬픔은 우리가 피하고 싶은 감정이지만, 무엇을 소중하게 여기고 있었는지를 알려주기도 합니다. 잃었기 때문에 슬프고, 사랑했기 때문에 아픕니다.

그래서 슬픔을 없애는 것보다 그 마음이 무엇을 말하는지 잠시 바라보는 일이 먼저일지도 모릅니다.

최근 당신을 슬프게 한 일은 무엇인가요?`
  },
  {
    key:'anger',
    start:'2026-10-12',
    char:'怒',
    reading:'성낼 노',
    phrase:'지키고 싶은 것이 있다는 신호',
    question:'최근 내가 화를 냈던 일은<br>무엇인가요?',
    prompt:'화가 난 장면 하나를 떠올리고, 그때 무엇을 지키고 싶었는지 생각해보세요.',
    story:`怒는 奴와 心이 합쳐진 글자입니다.

분노는 갑자기 생겨나는 것처럼 보이지만 대개 이유가 있습니다. 무시당했을 때, 부당한 일을 겪었을 때, 소중한 것이 침해되었을 때 마음은 강하게 반응합니다.

분노는 없애야 할 감정이라기보다 무엇인가 잘못되었다고 알려주는 신호일 수 있습니다.

당신의 분노는 무엇을 지키려고 하고 있나요?`
  },
  {
    key:'fear',
    start:'2026-10-19',
    char:'恐',
    reading:'두려울 공',
    phrase:'멈추게 하고 살피게 하는 마음',
    question:'요즘 내가 가장 두려워하는 것은<br>무엇인가요?',
    prompt:'두려움이 생기는 장면과, 그 두려움이 알려주는 것을 함께 떠올려보세요.',
    story:`恐은 마음 心을 아래에 둔 글자입니다.

두려움은 위험 앞에서 몸과 마음이 보내는 경고입니다. 우리를 멈추게 하기도 하지만, 무엇을 조심해야 하는지 알려주기도 합니다.

용기는 두려움이 없는 상태라기보다 두려움을 느끼면서도 내가 중요하게 여기는 것을 향해 움직이는 힘인지도 모릅니다.

당신은 지금 무엇을 두려워하고 있나요?`
  },
  {
    key:'nov-surprise',
    start:'2026-10-27',
    char:'驚',
    reading:'놀랄 경',
    phrase:'일상에서 만나는 놀라움',
    question:'최근 가장 놀랐던 일은<br>무엇인가요?',
    prompt:'뜻밖의 소식이나 장면을 떠올려보세요.<br>그때 어떤 기분이 들었나요?',
    story:`驚은 敬(공경할 경)과 馬(말 마)가 합쳐진 글자입니다. 갑자기 놀라 뛰는 말처럼, 예상하지 못한 일을 만났을 때 몸과 마음이 반응하는 모습을 떠올릴 수 있습니다.

놀라움에는 두려움도 있지만, 감탄과 경이로움도 있습니다. 평소에는 당연하게 여기던 것들이 어느 순간 새롭게 보이기도 합니다.

최근 당신을 놀라게 한 일은 무엇인가요?`
  },
  {
    key:'nov-hope',
    start:'2026-11-03',
    char:'望',
    reading:'바랄 망',
    phrase:'먼 곳을 바라보는 마음',
    question:'요즘 가장 바라는 것은<br>무엇인가요?',

우리는 아직 손에 닿지 않는 것을 바라보며 살아갑니다. 어떤 바람은 금세 이루어지고, 어떤 바람은 오랫동안 우리의 발걸음을 이끕니다.

지금 당신이 바라보고 있는 것은 무엇인가요?`
  },

    question:'요즘 어떤 생각이 자꾸<br>머릿속을 맴도나요?',
    prompt:'해결하지 못한 일이나 자꾸 떠오르는<br>걱정 하나를 적어보세요.',
    story:`煩은 火(불 화)와 頁(머리 혈)이 합쳐진 글자입니다. 머리 속에 불이 타오르는 것처럼 생각이 복잡하게 뒤엉키는 모습이 떠오릅니다.

걱정은 한 번 시작되면 꼬리에 꼬리를 물기도 합니다. 이미 지나간 일을 되짚거나 아직 일어나지 않은 일을 걱정하다 보면 어느새 머릿속이 가득 찹니다.

  },
  {
    key:'nov-wish',
    start:'2026-11-17',
    char:'願',
    reading:'원할 원',

    question:'오랫동안 마음에 품어온<br>소원은 무엇인가요?',
    prompt:'꼭 이루고 싶은 일이나 누군가를 위해<br>빌었던 소원을 떠올려보세요.',
    story:`願은 原(언덕 원)과 頁(머리 혈)이 합쳐진 글자입니다. 깊은 샘 앞에서 머리를 숙이고 소원을 비는 사람의 모습이 떠오릅니다.

사람들은 오래전부터 물 앞에서 소원을 빌었습니다. 정화수를 떠놓고 가족의 안녕을 기원하듯, 어떤 바람은 쉽게 사라지지 않고 마음 깊은 곳에 남습니다.

당신이 오랫동안 품어온 소원은 무엇인가요?`
  }
];

const data = Object.fromEntries(
  cards.map(card=>[card.key,card])
);

/* 오늘 날짜: 한국 시간 */

function todayKST(){
  const parts = new Intl.DateTimeFormat('en-CA',{
    timeZone:'Asia/Seoul',
    year:'numeric',
    month:'2-digit',
    day:'2-digit'
  }).formatToParts(new Date());

  const m = Object.fromEntries(
    parts.map(p=>[p.type,p.value])
  );

  return `${m.year}-${m.month}-${m.day}`;
}

/* 카드 표시 기간 */

function weekRange(start){
  const ordered = [...cards].sort(
    (a,b)=>a.start.localeCompare(b.start)
  );

  const index = ordered.findIndex(c=>c.start===start);
  const next = ordered[index+1];

  const [y,m,d] = start.split('-').map(Number);
  const a = new Date(Date.UTC(y,m-1,d));

  const b = next
    ? new Date(Date.UTC(
        ...next.start.split('-').map((v,i)=>
          i===1 ? Number(v)-1 : Number(v)
        )
      ))
    : new Date(a);

  if(next){
    b.setUTCDate(b.getUTCDate()-1);
  }else{
    b.setUTCDate(b.getUTCDate()+6);
  }

  const f=x=>String(x).padStart(2,'0');
  const format=x=>
    `${f(x.getUTCMonth()+1)}.${f(x.getUTCDate())}`;

  return `${format(a)}–${format(b)}`;
}

/* 시작일에 한국 시간 00:00부터 카드 전환 */

function activeKeyFromDate(date=todayKST()){
  // 테스트용: ?hanja=nov-hope 또는 ?hanja=望

  const forced = new URLSearchParams(
    location.search
  ).get('hanja');

  if(forced){
    const found = [...cards].reverse().find(
      c=>c.key===forced || c.char===forced
    );

    if(found)return found.key;
  }

  const ordered = [...cards].sort(
    (a,b)=>a.start.localeCompare(b.start)
  );

  let active = ordered[0];

  for(const c of ordered){
    if(c.start<=date){
      active=c;
    }else{
      break;
    }
  }

  return active.key;
}

let current = activeKeyFromDate();

/* 지난주 카드 선택 */

function previousKey(){
  const ordered=[...cards].sort(
    (a,b)=>a.start.localeCompare(b.start)
  );

  const index=ordered.findIndex(
    c=>c.key===activeKeyFromDate()
  );

  return index>0 ? ordered[index-1].key : null;
}

/* 두 카드 표시 */

function renderDeck(){
  const active=data[activeKeyFromDate()];
  const previous=data[previousKey()];

  const ordered=[...cards].sort(
    (a,b)=>b.start.localeCompare(a.start)
  );

  function fillDeck(id, selected, label, stacked){
    const deck=document.getElementById(id);
    deck.innerHTML='';

    if(!selected){
      const empty=document.createElement('p');
      empty.className='week-empty';
      empty.textContent='아직 지난주 카드가 없습니다.';
      deck.appendChild(empty);
      return;
    }

    const order=stacked
      ? [selected,...ordered.filter(
          c=>c.start<selected.start
        )].slice(0,6)
      : [selected];

    order.forEach((d,i)=>{
      const card=document.createElement('div');

      card.className='deck-card '+(
        i===0 ? 'active' : `back-${i}`
      );

      card.style.zIndex=String(30-i);

      card.innerHTML=`
        <div class="date">${weekRange(d.start)}</div>
        ${i===0?`<div class="now">${label}</div>`:''}
        <div class="letter">${d.char}</div>
        <div class="reading">${d.reading}</div>
        <div class="tag">${d.phrase}</div>
      `;

      if(i===0){
        card.setAttribute('role','button');
        card.tabIndex=0;

        card.setAttribute(
          'aria-label',
          label+' '+d.char+' '+d.reading+' 질문 열기'
        );

        card.addEventListener(
          'click',
          ()=>choose(d.key)
        );

        card.addEventListener('keydown',e=>{
          if(e.key==='Enter'||e.code==='Space'){
            e.preventDefault();
            e.stopPropagation();
            choose(d.key);
          }
        });
      }else{
        card.setAttribute('aria-hidden','true');
        card.style.pointerEvents='none';
      }

      deck.appendChild(card);
    });
  }

  fillDeck('previousDeck',previous,'지난주',false);
  fillDeck('deck',active,'이번 주',true);

  document.getElementById('previousOpen').disabled=!previous;

  document.getElementById('counter').textContent=
    (previous ? previous.char+' · ' : '')+active.char;

  document.getElementById('archiveNote').textContent=
    '매주 새 한자가 열리면 지난주 카드도 함께 바뀝니다.';
}

/* 카드 섞기 */

function shuffleDeck(){
  const deck=document.getElementById('deck');

  deck.classList.remove('shuffling');
  void deck.offsetWidth;
  deck.classList.add('shuffling');

  setTimeout(
    ()=>deck.classList.remove('shuffling'),
    900
  );
}

/* 카드 열기 */

function choose(type){
  const d=data[type];
  if(!d)return;

  current=type;

  const label=type===activeKeyFromDate()
    ? '이번 주'
    : '지난주';

  document.getElementById('selectionLabel').textContent=
    label+'의 한자 · '+weekRange(d.start);

  document.getElementById('home')
    .classList.add('hidden');

  document.getElementById('cardScreen')
    .classList.remove('hidden');

  document.getElementById('bigChar').textContent=d.char;
  document.getElementById('reading').textContent=d.reading;
  document.getElementById('phrase').textContent=d.phrase;
  document.getElementById('question').innerHTML=d.question;
  document.getElementById('prompt').innerHTML=d.prompt;

  document.getElementById('card')
    .classList.remove('flipped');

  document.getElementById('counter').textContent=d.char;
}

/* 카드 뒤집기 */

function flipCard(){
  document.getElementById('card')
    .classList.toggle('flipped');
}

/* 메인 화면으로 돌아가기 */

function home(){
  current=activeKeyFromDate();

  document.getElementById('cardScreen')
    .classList.add('hidden');

  document.getElementById('home')
    .classList.remove('hidden');

  renderDeck();
}

/* 카드 해설 */

function openExplain(){
  const d=data[current];

  document.getElementById('mletter').textContent=d.char;

  document.getElementById('mtitle').textContent=
    d.reading+' · '+d.phrase;

  document.getElementById('storyText').textContent=d.story;
  document.getElementById('mquestion').innerHTML=d.question;

  document.getElementById('modal')
    .classList.remove('hidden');
}

/* 내 이야기 남기기 */

function story(){
  const d=data[current];

  document.getElementById('storyHeading').textContent=
    d.char+' · '+d.reading+' — 내 이야기 남기기';

  const frame=document.getElementById('storyFrame');

  if(!frame.src){
    frame.src=
      'https://docs.google.com/forms/d/1rQY5PHKkGA31ON1RQDnor91ufuciVmziSLKlvdksg6U/viewform?embedded=true';
  }

  document.getElementById('storyModal')
    .classList.remove('hidden');
}

/* 팝업 닫기 */

function closeModal(){
  document.querySelectorAll('.modal').forEach(
    x=>x.classList.add('hidden')
  );
}

/* 날짜 변경 감지 */

let lastDate = todayKST();

function checkDateChange(){
  const now=todayKST();

  if(now!==lastDate){
    lastDate=now;

    // 카드 화면에서는 읽던 내용을 유지합니다.
    if(
      document.getElementById('cardScreen')
        .classList.contains('hidden')
    ){
      current=activeKeyFromDate();
      renderDeck();
    }
  }
}

setInterval(checkDateChange,60000);

/* 최초 실행 */

renderDeck();
setTimeout(shuffleDeck,250);

/* 키보드 조작 */

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    closeModal();
  }

  if(
    e.code==='Space' &&
    !document.getElementById('cardScreen')
      .classList.contains('hidden') &&
    document.getElementById('storyModal')
      .classList.contains('hidden') &&
    document.getElementById('modal')
      .classList.contains('hidden')
  ){
    e.preventDefault();
    flipCard();
  }

  if(
    e.key.toLowerCase()==='n' &&
    !['INPUT','TEXTAREA'].includes(
      document.activeElement.tagName
    )
  ){
    home();
  }
});
</script>
